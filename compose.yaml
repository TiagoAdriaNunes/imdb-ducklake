name: imdb-ducklake

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ducklake_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-imdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imdb-local-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 256mb

  lakehouse:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: imdb-ducklake:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Pipeline builds write to ./data; docker-cloud is for the app after upload.
      IMDB_DUCKLAKE_ENV: docker
      IMDB_DUCKLAKE_CATALOG_URL: ${IMDB_DUCKLAKE_CATALOG_URL:-postgresql://imdb:imdb-local-dev@postgres:5432/ducklake_catalog}
      IMDB_DUCKLAKE_DBT_THREADS: ${IMDB_DUCKLAKE_DBT_THREADS:-2}
      IMDB_DUCKLAKE_QUERY_THREADS: ${IMDB_DUCKLAKE_QUERY_THREADS:-2}
      IMDB_DUCKLAKE_INGEST_WORKERS: ${IMDB_DUCKLAKE_INGEST_WORKERS:-2}
      IMDB_LAKEHOUSE_LOG_LEVEL: ${IMDB_LAKEHOUSE_LOG_LEVEL:-DEBUG}
      # Docker Desktop currently exposes about 8GB. Leave headroom for Python, dbt, dlt, and WSL;
      # exceeding the cgroup limit makes Linux SIGKILL dbt with exit code -9.
      IMDB_DUCKLAKE_DUCKDB_MEMORY_LIMIT: ${IMDB_DUCKLAKE_DUCKDB_MEMORY_LIMIT:-6GB}
      IMDB_DUCKLAKE_READ_AHEAD_DEPTH: ${IMDB_DUCKLAKE_READ_AHEAD_DEPTH:-0}
      # Per-build scratch (DuckDB spill, dlt load packages), emptied before and after each build.
      # On the host disk, not a Docker volume: Docker's disk file never shrinks after deletes.
      IMDB_DUCKLAKE_SCRATCH_DIR: /data/.scratch
    volumes:
      - ./data:/data

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: imdb-ducklake:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["app"]
    environment:
      # docker-cloud instead of docker in your .env additionally requires IMDB_DUCKLAKE_REMOTE_STORAGE
      # (hf or b2, enforced by Settings.load) rather than silently falling back to local storage.
      IMDB_DUCKLAKE_ENV: ${IMDB_DUCKLAKE_ENV:-docker}
      IMDB_DUCKLAKE_CATALOG_URL: ${IMDB_DUCKLAKE_CATALOG_URL:-postgresql://imdb:imdb-local-dev@postgres:5432/ducklake_catalog}
      IMDB_DUCKLAKE_QUERY_THREADS: ${IMDB_DUCKLAKE_QUERY_THREADS:-2}
      IMDB_DUCKLAKE_APP_PORT: 8000
      # Under docker-cloud, reads the app tables from hf (HF_DATASET_REPO, ADR 0013) or b2
      # (B2_BUCKET at BLAZE_ENDPOINT, ADR 0017) instead of local current/storage.
      # HF_TOKEN authenticates the private HF repo - the container has no host `hf auth login`.
      IMDB_DUCKLAKE_REMOTE_STORAGE: ${IMDB_DUCKLAKE_REMOTE_STORAGE:-}
      HF_DATASET_REPO: ${HF_DATASET_REPO:-}
      HF_TOKEN: ${HF_TOKEN:-}
      B2_BUCKET: ${B2_BUCKET:-}
      BLAZE_ENDPOINT: ${BLAZE_ENDPOINT:-}
      # DuckDB's S3 secret reads the B2 key from these, so it never appears in SQL.
      AWS_ACCESS_KEY_ID: ${BLAZE_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BLAZE_TOKEN:-}
      # Copy the app tables into memory at startup (ADR 0016); false queries storage directly.
      IMDB_DUCKLAKE_APP_PRELOAD: ${IMDB_DUCKLAKE_APP_PRELOAD:-true}
    ports:
      - "${IMDB_DUCKLAKE_APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
