version: 2

# Serving layer for the Shiny app (ADR 0016): thin, display-ready slices of the marts. The app
# reads only this schema, and only this schema is uploaded to remote storage.
models:
  - name: app_title_search
    description: >
      Display-ready movies and TV series for the app's search, grain tconst. Partitioned by
      title_type, so DuckLake skips the other type's files using catalog metadata alone.
    config:
      contract: {enforced: true}
      partitioned_by: title_type
    columns:
      - {name: tconst, data_type: varchar, description: Title key., data_tests: [not_null, unique]}
      - name: title_type
        data_type: varchar
        description: movie or tvSeries.
        data_tests:
          - accepted_values:
              arguments: {values: [movie, tvSeries]}
      - {name: primary_title, data_type: varchar, description: Searchable title text.}
      - {name: original_title, data_type: varchar, description: Original title text.}
      - {name: start_year, data_type: smallint, description: Release start year; TV series start year for series.}
      - {name: end_year, data_type: smallint, description: TV series end year; null for movies.}
      - {name: runtime_minutes, data_type: integer, description: "Primary runtime, in minutes."}
      - {name: episode_count, data_type: bigint, description: Number of linked episodes; null for movies.}
      - {name: average_rating, data_type: double, description: Average rating measure.}
      - {name: num_votes, data_type: bigint, description: Vote-count measure.}
      - {name: genres_text, data_type: varchar, description: Comma-joined genre list.}
      - {name: directors_text, data_type: varchar, description: Comma-joined director name list.}
      - {name: writers_text, data_type: varchar, description: Comma-joined writer name list.}
  - name: app_title_cast
    description: >
      Cast credits (actor, actress, self) for app_title_search's titles, grain (tconst, ordering).
      Sorted by tconst, so each file covers a distinct tconst range.
    config:
      contract: {enforced: true}
      sorted_by: tconst
    columns:
      - {name: tconst, data_type: varchar, description: Title key., data_tests: [not_null]}
      - {name: nconst, data_type: varchar, description: Person key.}
      - {name: primary_name, data_type: varchar, description: Person display name.}
      - {name: category, data_type: varchar, description: "actor, actress, or self."}
      - {name: ordering, data_type: integer, description: IMDb principal-credit ordering.}
      - {name: characters_text, data_type: varchar, description: "Comma-joined character names, if any."}
  - name: app_top_movies
    description: Display-ready top-500 movies from mart_top_titles, grain tconst.
    config:
      contract: {enforced: true}
    columns:
      - {name: tconst, data_type: varchar, description: Title key., data_tests: [not_null, unique]}
      - {name: primary_title, data_type: varchar, description: Searchable title text.}
      - {name: original_title, data_type: varchar, description: Original title text.}
      - {name: start_year, data_type: smallint, description: Release start year.}
      - {name: runtime_minutes, data_type: integer, description: "Runtime, in minutes."}
      - {name: average_rating, data_type: double, description: Average rating measure.}
      - {name: num_votes, data_type: bigint, description: Vote-count measure.}
      - {name: title_rank, data_type: bigint, description: Rank by rating/votes; 1 is best., data_tests: [not_null]}
      - {name: genres_text, data_type: varchar, description: Comma-joined genre list.}
      - {name: directors_text, data_type: varchar, description: Comma-joined director name list.}
      - {name: writers_text, data_type: varchar, description: Comma-joined writer name list.}
  - name: app_top_tv_series
    description: Display-ready top-500 TV series from mart_top_titles, grain tconst.
    config:
      contract: {enforced: true}
    columns:
      - {name: tconst, data_type: varchar, description: Title key., data_tests: [not_null, unique]}
      - {name: primary_title, data_type: varchar, description: Searchable title text.}
      - {name: original_title, data_type: varchar, description: Original title text.}
      - {name: start_year, data_type: smallint, description: Release start year.}
      - {name: end_year, data_type: smallint, description: Series end year.}
      - {name: runtime_minutes, data_type: integer, description: "Episode runtime, in minutes."}
      - {name: episode_count, data_type: bigint, description: Number of linked episodes.}
      - {name: average_rating, data_type: double, description: Average rating measure.}
      - {name: num_votes, data_type: bigint, description: Vote-count measure.}
      - {name: title_rank, data_type: bigint, description: Rank by rating/votes; 1 is best., data_tests: [not_null]}
      - {name: genres_text, data_type: varchar, description: Comma-joined genre list.}
      - {name: directors_text, data_type: varchar, description: Comma-joined director name list.}
      - {name: writers_text, data_type: varchar, description: Comma-joined writer name list.}
