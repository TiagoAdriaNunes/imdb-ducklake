version: 2

models:
  - name: mart_title_search
    description: One search-ready row per title with ratings, genres, directors, and writers, grain tconst.
    config:
      contract: {enforced: true}
    columns:
      - {name: tconst, data_type: varchar, description: Title key., data_tests: [not_null, unique]}
      - {name: title_type, data_type: varchar, description: "IMDb title type, e.g. movie, short, tvSeries, tvEpisode."}
      - {name: primary_title, data_type: varchar, description: Searchable title text.}
      - {name: original_title, data_type: varchar, description: Original title text.}
      - {name: is_adult, data_type: boolean, description: Adult-content flag.}
      - {name: start_year, data_type: smallint, description: Release start year; TV series start year for series.}
      - {name: end_year, data_type: smallint, description: TV series end year; null for all other title types.}
      - {name: runtime_minutes, data_type: integer, description: "Primary runtime, in minutes."}
      - {name: episode_count, data_type: bigint, description: Number of episodes linked to a TV series; null for non-series titles.}
      - {name: average_rating, data_type: double, description: Average rating measure.}
      - {name: num_votes, data_type: bigint, description: Vote-count measure.}
      - {name: genres, data_type: "varchar[]", description: Genre array.}
      - {name: directors, data_type: "varchar[]", description: Director name array.}
      - {name: writers, data_type: "varchar[]", description: Writer name array.}
      - {name: dlt_load_id, data_type: varchar, description: Raw title lineage., data_tests: [not_null]}
  - name: mart_genre_year_summary
    description: Title, rating, and vote summaries by year, title type, and genre, grain (start_year, title_type, genre).
    config:
      contract: {enforced: true}
    columns:
      - {name: start_year, data_type: smallint, description: Release year grouping.}
      - {name: title_type, data_type: varchar, description: IMDb title-type grouping.}
      - {name: genre, data_type: varchar, description: Genre grouping., data_tests: [not_null]}
      - {name: title_count, data_type: bigint, description: Number of titles., data_tests: [not_null]}
      - {name: rated_title_count, data_type: bigint, description: Number of rated titles., data_tests: [not_null]}
      - {name: average_rating, data_type: double, description: Mean rating of rated titles.}
      - {name: total_votes, data_type: hugeint, description: Sum of title vote counts., data_tests: [not_null]}
  - name: mart_person_filmography
    description: Searchable people-to-title credits for cast, directors, and writers with role and rating details, grain (nconst, tconst, category, ordering).
    config:
      contract: {enforced: true}
    columns:
      - {name: nconst, data_type: varchar, description: Person key., data_tests: [not_null]}
      - {name: primary_name, data_type: varchar, description: Person display name.}
      - {name: tconst, data_type: varchar, description: Credited title key., data_tests: [not_null]}
      - {name: primary_title, data_type: varchar, description: Credited title text.}
      - {name: title_type, data_type: varchar, description: Credited title's IMDb title type.}
      - {name: start_year, data_type: smallint, description: Credited title's release start year.}
      - {name: ordering, data_type: integer, description: IMDb principal-credit ordering; null for director and writer credits.}
      - {name: category, data_type: varchar, description: "Credit role, including principal categories, director, and writer."}
      - {name: job, data_type: varchar, description: "Specific job title, if applicable."}
      - {name: characters, data_type: "varchar[]", description: "Character name array, if applicable."}
      - {name: average_rating, data_type: double, description: Optional title rating.}
      - {name: num_votes, data_type: bigint, description: Optional title vote count.}
      - {name: dlt_load_id, data_type: varchar, description: Raw credit lineage., data_tests: [not_null]}
  - name: mart_series_episodes
    description: Series, season, and episode navigation with optional rating measures, grain episode_tconst.
    config:
      contract: {enforced: true}
    columns:
      - {name: series_tconst, data_type: varchar, description: Parent series key., data_tests: [not_null]}
      - {name: series_title, data_type: varchar, description: Parent series title.}
      - {name: episode_tconst, data_type: varchar, description: Episode title key., data_tests: [not_null, unique]}
      - {name: episode_title, data_type: varchar, description: Episode title.}
      - {name: season_number, data_type: integer, description: Season number.}
      - {name: episode_number, data_type: integer, description: Episode number.}
      - {name: episode_start_year, data_type: smallint, description: Episode title's release start year.}
      - {name: average_rating, data_type: double, description: Optional episode rating.}
      - {name: num_votes, data_type: bigint, description: Optional episode vote count.}
      - {name: dlt_load_id, data_type: varchar, description: Raw episode lineage., data_tests: [not_null]}
