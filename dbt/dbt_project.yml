name: imdb_ducklake
version: 1.0.0
config-version: 2

profile: imdb_ducklake

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  imdb_ducklake:
    +database: imdb_lake
    +meta:
      owner: imdb-ducklake application/build.py pipeline (single local operator, no external write access)
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    # App serving layer (ADR 0016). Schema-scoped DuckLake options: smaller zstd files read
    # faster from remote storage. Set before each build; they persist in the catalog.
    app:
      +schema: app
      +materialized: table
      +pre-hook:
        - "call {{ this.database }}.set_option('parquet_compression', 'zstd', schema => '{{ this.schema }}')"
        - "call {{ this.database }}.set_option('target_file_size', '32MB', schema => '{{ this.schema }}')"
flags:
  require_generic_test_arguments_property: true