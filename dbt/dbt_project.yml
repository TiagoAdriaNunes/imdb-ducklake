name: imdb_ducklake
version: 1.0.0
config-version: 2

profile: imdb_ducklake

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  imdb_ducklake:
    +database: imdb_lake
    +meta:
      owner: imdb-ducklake application/build.py pipeline (single local operator, no external write access)
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
